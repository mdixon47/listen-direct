name: CI and security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NUXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NUXT_PUBLIC_SUPABASE_KEY: sb_publishable_ci_placeholder

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 24 LTS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Scan repository for exposed secrets
        run: npm run security:secrets

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Type-check Nuxt application
        run: npm run typecheck

      - name: Build production application with non-production Supabase placeholders
        run: npm run build
